<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recettes Padlewski</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <h1>Recettes</h1>
  <p class="sub">De la <a href="../">famille Padlewski</a></p>

<!-- recipes:start (generated by ./build-recipes.py build: edit the recipes, not this) -->
<nav class="filters" aria-label="Filtrer les recettes">
  <div class="filter"><span class="label">Cuisine</span>
    <a class="chip" href="./" data-kind="cuisine" data-value="">Toutes</a>
    <a class="chip" href="?cuisine=Italienne" data-kind="cuisine" data-value="Italienne">Italienne <span class="n">1</span></a>
  </div>
  <div class="filter"><span class="label">Source</span>
    <a class="chip" href="./" data-kind="source" data-value="">Toutes</a>
    <a class="chip" href="?source=GialloZafferano" data-kind="source" data-value="GialloZafferano">GialloZafferano <span class="n">1</span></a>
    <a class="chip" href="?source=Mathieu" data-kind="source" data-value="Mathieu">Mathieu <span class="n">1</span></a>
  </div>
</nav>
<section data-cuisine="Italienne">
  <h2>Italienne</h2>
  <ul class="recipes">
    <li data-cuisine="Italienne" data-source="GialloZafferano|Mathieu"><a class="name" href="ragu-alla-bolognese/">Ragù alla bolognese</a> <span class="tags"><a class="tag" href="?source=GialloZafferano">GialloZafferano</a> <a class="tag" href="?source=Mathieu">Mathieu</a></span></li>
  </ul>
</section>
<!-- recipes:end -->

  <p class="empty" hidden>Aucune recette ne correspond à ces filtres.</p>

<script>
(function () {
  var KINDS = ["cuisine", "source"];
  var items = [].slice.call(document.querySelectorAll(".recipes li"));
  var sections = [].slice.call(document.querySelectorAll("section[data-cuisine]"));
  var chips = [].slice.call(document.querySelectorAll(".chip"));
  var empty = document.querySelector(".empty");
  var state;

  function read(search) {
    var p = new URLSearchParams(search), s = {};
    KINDS.forEach(function (k) { s[k] = (p.get(k) || "").toLowerCase(); });
    return s;
  }

  function query(s) {
    var p = new URLSearchParams();
    KINDS.forEach(function (k) { if (s[k]) p.set(k, s[k]); });
    var q = p.toString();
    return q ? "?" + q : location.pathname;
  }

  function apply() {
    var shown = 0;
    items.forEach(function (li) {
      var ok = (!state.cuisine || li.dataset.cuisine.toLowerCase() === state.cuisine) &&
               (!state.source || li.dataset.source.toLowerCase().split("|").indexOf(state.source) >= 0);
      li.hidden = !ok;
      if (ok) shown++;
    });
    sections.forEach(function (sec) { sec.hidden = !sec.querySelector("li:not([hidden])"); });
    chips.forEach(function (c) {
      var k = c.dataset.kind, v = c.dataset.value.toLowerCase(), next = {};
      KINDS.forEach(function (x) { next[x] = state[x]; });
      next[k] = v;
      c.href = query(next);
      c.setAttribute("aria-current", state[k] === v ? "true" : "false");
    });
    empty.hidden = shown > 0;
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest(".chip, .tag");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    state = read(a.search);
    history.pushState(null, "", query(state));
    apply();
  });
  window.addEventListener("popstate", function () { state = read(location.search); apply(); });

  // Opened from disk (file://), a folder link does not open its index.html by itself.
  if (location.protocol === "file:") {
    [].slice.call(document.querySelectorAll(".name")).forEach(function (a) { a.href += "index.html"; });
  }

  state = read(location.search);
  apply();
})();
</script>
<script src="fast.js" defer></script>
</body>
</html>
